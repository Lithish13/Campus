# Production Docker Compose configuration (Section 81)
# Note: PostgreSQL is attached only to the internal backend_net network
# and is NOT exposed on a public host port in production.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crx_production}
      POSTGRES_USER: ${POSTGRES_USER:-crx_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-crx_app} -d $${POSTGRES_DB:-crx_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://your-domain.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://your-domain.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crx_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crx_production}
    volumes:
      - private_uploads_data:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://your-domain.com}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - frontend_net

networks:
  backend_net:
    internal: true
  frontend_net:
    driver: bridge

volumes:
  postgres_data:
  private_uploads_data:
